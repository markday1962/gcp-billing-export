<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --surface-2:   #f3f2ee;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --grid:        #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --accent:      #2a78d6;
    --bar:         #2a78d6;
    --bar-2:       #eb6834;
    --good:        #0ca30c;
    --serious:     #ec835a;
    --shadow:      0 1px 2px rgba(11,11,11,0.04), 0 8px 24px rgba(11,11,11,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --surface-2:   #212120;
      --ink:         #ffffff;
      --ink-2:       #c3c2b7;
      --ink-muted:   #898781;
      --grid:        #2c2c2a;
      --baseline:    #383835;
      --border:      rgba(255,255,255,0.10);
      --accent:      #3987e5;
      --bar:         #3987e5;
      --bar-2:       #d95926;
      --good:        #0ca30c;
      --serious:     #ec835a;
      --shadow:      0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #212120;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --ink-muted:   #898781;
    --grid:        #2c2c2a;
    --baseline:    #383835;
    --border:      rgba(255,255,255,0.10);
    --accent:      #3987e5;
    --bar:         #3987e5;
    --bar-2:       #d95926;
    --good:        #0ca30c;
    --serious:     #ec835a;
    --shadow:      0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 28px 80px; display: flex; flex-direction: column; gap: 28px; }
  @media (max-width: 640px) { .wrap { padding: 24px 16px 60px; } }
  h1, h2, h3 { font-family: "Sora", system-ui, sans-serif; margin: 0; text-wrap: balance; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  header.top h1 { font-size: 30px; font-weight: 700; }
  header.top .sub { color: var(--ink-2); font-size: 14.5px; margin-top: 6px; max-width: 70ch; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }

  .summary-scroll { overflow-x: auto; }
  table.summary { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.summary th, table.summary td { padding: 12px 16px; text-align: right; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.summary th:first-child, table.summary td:first-child { text-align: left; font-variant-numeric: normal; white-space: nowrap; width: 1%; }
  table.summary th:last-child, table.summary td:last-child { width: auto; }
  @media (max-width: 480px) { table.summary th:first-child, table.summary td:first-child { white-space: normal; } }
  table.summary thead th { color: var(--ink-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.02em; border-bottom: 1px solid var(--baseline); }
  table.summary tbody td { font-weight: 600; }
  table.summary tbody td:first-child { font-weight: 700; }
  table.summary tbody tr:last-child td { border-bottom: none; }
  table.summary tbody td.sub-row { font-weight: 500; color: var(--ink-2); padding-left: 30px; }
  table.summary tbody tr:has(td.sub-row) td { font-weight: 500; color: var(--ink-2); }
  .summary-wrap { padding: 22px 22px 8px; }
  .summary-caption { padding: 0 22px 20px; font-size: 12.5px; color: var(--ink-muted); line-height: 1.55; }
  .summary-caption p { margin: 0 0 10px; }
  .summary-caption strong { color: var(--ink-2); }

  section.chart-card { padding: 24px 26px 20px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .chart-head h2 { font-size: 17px; font-weight: 600; }
  .chart-head .note { font-size: 12.5px; color: var(--ink-muted); }
  .caveat { font-size: 12px; color: var(--serious); background: color-mix(in srgb, var(--serious) 12%, transparent); border-radius: 8px; padding: 8px 12px; margin: 10px 0 4px; line-height: 1.5; }

  .bar-row { display: grid; grid-template-columns: 180px 1fr 100px; align-items: center; gap: 12px; padding: 7px 0; position: relative; }
  @media (max-width: 640px) { .bar-row { grid-template-columns: 110px 1fr 84px; gap: 8px; } }
  .bar-row .name { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row .track { height: 20px; border-radius: 5px; background: var(--surface-2); position: relative; overflow: hidden; }
  .bar-row .fill { height: 100%; border-radius: 5px; background: var(--bar); }
  .bar-row .value { font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .bar-chart { padding: 10px 0; position: relative; }

  details.table-toggle { margin-top: 14px; }
  .sub-head { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); margin: 16px 0 2px; }
  details.table-toggle summary { cursor: pointer; padding: 10px 0; font-size: 13px; font-weight: 600; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 8px; }
  details.table-toggle summary::-webkit-details-marker { display: none; }
  details.table-toggle summary::before { content: "▸"; color: var(--ink-muted); transition: transform 0.15s ease; font-size: 11px; }
  details.table-toggle[open] summary::before { transform: rotate(90deg); }
  .table-wrap { overflow-x: auto; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table th, table.data-table td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.data-table th:first-child, table.data-table td:first-child { text-align: left; font-variant-numeric: normal; }
  table.data-table tr.total td { font-weight: 700; border-top: 1px solid var(--baseline); border-bottom: none; }
  table.data-table thead th { color: var(--ink-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--baseline); }

  footer.notes { padding: 18px 22px; font-size: 12px; color: var(--ink-muted); line-height: 1.6; }
</style>
